services:
  STACK_PLACEHOLDER-app:
    image: IMAGE_PLACEHOLDER
    environment:
      - PORT=3000
    networks:
      - caddy
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 20s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 0s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        caddy: HOST_PLACEHOLDER
        caddy.tls: "alexandergv2117@gmail.com"
        caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  caddy:
    external: true